pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,json,css,md,yml}'
      run: npx oxfmt --check {staged_files}
    lint:
      glob: '*.{ts,tsx}'
      run: npx oxlint {staged_files}
    typecheck:
      glob: '*.{ts,tsx}'
      run: pnpm typecheck
    test:
      glob: '*.{ts,tsx}'
      run: pnpm test
    rustfmt:
      glob: 'src-tauri/**/*.rs'
      run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
    clippy:
      glob: 'src-tauri/**/*.rs'
      run: pnpm lint:rust
