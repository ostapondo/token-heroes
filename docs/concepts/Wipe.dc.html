<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Party wiped, respawn loop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Pixelify+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#e8b23a}a:hover{color:#ffd27a}
.bob{animation:bob .45s steps(2) infinite}
@keyframes bob{0%{transform:translateY(0)}100%{transform:translateY(-4px)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 30px rgba(224,37,47,.3)}50%{box-shadow:inset 0 0 90px rgba(224,37,47,.75)}}
.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.p-rise{position:absolute;bottom:-8px;width:3px;height:3px;animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(-12px,-250px);opacity:0}}
.tick{animation:tick 1s steps(4)}
@keyframes tick{0%{transform:scale(1.5);opacity:.4}40%{transform:scale(1);opacity:1}100%{transform:scale(1)}}
.fight{animation:fight 1.2s ease-out forwards}
@keyframes fight{0%{transform:scale(2.2);opacity:0}20%{transform:scale(1);opacity:1}70%{opacity:1}100%{transform:scale(1);opacity:0}}
.rise-up{animation:riseup .5s steps(4)}
@keyframes riseup{0%{transform:translateY(16px);filter:brightness(3)}100%{transform:translateY(0);filter:none}}
.autohit{animation:autohit 1s steps(1) infinite}
@keyframes autohit{0%,60%{opacity:0}62%,80%{opacity:1}82%,100%{opacity:0}}
</style>
</helmet>
<div style="width: 400px; height: 720px; box-sizing: border-box; background: #0d0b09; color: #efe6d4; font-family: 'Pixelify Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px">
<span style="font-family: 'Jersey 10', monospace; font-size: 26px; line-height: 1">STAGE 45</span>
<span style="font-size: 14px; color: #a89a84">{{phaseLabel}}</span>
</div>

<div style="position: relative; height: 360px; margin: 0 12px; overflow: hidden; background: #140305; border: 2px solid #3b3128">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: #2a070a; border-top: 2px solid #000"></div>
<div style="position: absolute; right: 8px; bottom: 8px; width: 150px; height: 150px; transform: scaleY(.28); transform-origin: 50% 100%">
<svg class="spin" width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="68" fill="none" stroke="#e0252f" stroke-width="5" stroke-dasharray="14 8"></circle><circle cx="75" cy="75" r="52" fill="none" stroke="#ff7a3d" stroke-width="3" stroke-dasharray="4 10"></circle></svg>
</div>
<div class="pulse" style="position: absolute; inset: 0"></div>
<span class="p-rise" style="left: 12%; background: #ff4a3d; animation-duration: 2.6s; animation-delay: -.4s"></span>
<span class="p-rise" style="left: 28%; background: #ff9a3d; animation-duration: 3.1s; animation-delay: -1.8s"></span>
<span class="p-rise" style="left: 47%; background: #ff4a3d; animation-duration: 2.2s; animation-delay: -1.1s"></span>
<span class="p-rise" style="left: 63%; background: #ff9a3d; animation-duration: 3.4s; animation-delay: -2.5s"></span>
<span class="p-rise" style="left: 81%; background: #ff4a3d; animation-duration: 2.8s; animation-delay: -.9s"></span>

<div style="position: absolute; right: 12px; top: 12px; width: 180px; display: flex; flex-direction: column; gap: 4px; text-align: right">
<div style="font-family: 'Jersey 10', monospace; font-size: 20px; line-height: 1; text-shadow: 2px 2px 0 #000">Archfiend Malgor</div>
<div style="height: 10px; background: #000; border: 2px solid #000"><div style="width: {{hpPct}}%; height: 100%; background: #e0252f"></div></div>
</div>

<div class="bob" style="position: absolute; right: 18px; bottom: 26px; filter: drop-shadow(0 0 12px #e0252f)">
<svg width="128" height="128" viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#2a0408" d="M0 5h3v6h-3zM13 5h3v6h-3z"></path><path fill="#5a0a12" d="M1 6h1v4h-1zM14 6h1v4h-1z"></path><path fill="#e8d9c0" d="M1 1h2v2h-2zM2 3h2v2h-2zM13 1h2v2h-2zM12 3h2v2h-2z"></path><path fill="#8e0f1a" d="M3 5h10v8h-10z"></path><path fill="#4a060c" d="M3 11h10v2h-10zM4 13h3v3h-3zM9 13h3v3h-3zM4 6h3v1h-3zM9 6h3v1h-3z"></path><path fill="#ffd23f" d="M5 7h2v1h-2zM9 7h2v1h-2z"></path><path fill="#120406" d="M5 9h6v3h-6z"></path><path fill="#e8d9c0" d="M5 9h1v2h-1zM10 9h1v2h-1z"></path></svg>
</div>

<sc-if value="{{down}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 14px; bottom: 30px; display: flex; gap: 6px; align-items: flex-end; filter: grayscale(1) brightness(.5)">
<svg style="transform: rotate(-90deg)" width="40" height="50" viewBox="0 0 8 10" shape-rendering="crispEdges"><path fill="#8d95a3" d="M2 0h4v3h-4z"></path><path fill="#1a1a22" d="M2 1h4v1h-4z"></path><path fill="#5e6675" d="M2 3h4v4h-4z"></path><path fill="#b9842f" d="M0 3h3v5h-3z"></path><path fill="#3a3f4a" d="M2 7h1v3h-1zM5 7h1v3h-1z"></path></svg>
<svg style="transform: rotate(-90deg)" width="40" height="50" viewBox="0 0 8 10" shape-rendering="crispEdges"><path fill="#c9ced6" d="M2 0h4v3h-4z"></path><path fill="#1a1a22" d="M3 1h2v1h-2z"></path><path fill="#e8b23a" d="M2 3h4v4h-4z"></path><path fill="#e7b48f" d="M1 4h1v2h-1zM6 4h1v2h-1z"></path><path fill="#e8e8f0" d="M7 0h1v6h-1z"></path><path fill="#6b4a2e" d="M2 7h1v3h-1zM5 7h1v3h-1z"></path></svg>
<svg style="transform: rotate(-90deg)" width="40" height="50" viewBox="0 0 8 10" shape-rendering="crispEdges"><path fill="#4f9a4c" d="M2 0h4v3h-4zM1 2h1v2h-1z"></path><path fill="#e7b48f" d="M3 1h2v2h-2z"></path><path fill="#3d7a3a" d="M2 3h4v4h-4z"></path><path fill="#c08a4a" d="M0 2h1v6h-1z"></path><path fill="#5a4632" d="M2 7h1v3h-1zM5 7h1v3h-1z"></path></svg>
</div>
<div style="position: absolute; left: 0; right: 0; top: 70px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-shadow: 3px 3px 0 #000">
<div style="font-family: 'Jersey 10', monospace; font-size: 34px; line-height: 1; color: #ff5b4a">PARTY WIPED</div>
<div style="font-size: 13px">back in</div>
<div class="tick" style="font-family: 'Jersey 10', monospace; font-size: 72px; line-height: .9; color: #efe6d4">{{count}}</div>
</div>
</sc-if>

<sc-if value="{{fighting}}" hint-placeholder-val="{{ false }}">
<div class="rise-up" style="position: absolute; left: 14px; bottom: 30px; display: flex; gap: 6px; align-items: flex-end">
<svg width="40" height="50" viewBox="0 0 8 10" shape-rendering="crispEdges"><path fill="#8d95a3" d="M2 0h4v3h-4z"></path><path fill="#1a1a22" d="M2 1h4v1h-4z"></path><path fill="#5e6675" d="M2 3h4v4h-4z"></path><path fill="#b9842f" d="M0 3h3v5h-3z"></path><path fill="#e8b23a" d="M1 4h1v2h-1z"></path><path fill="#3a3f4a" d="M2 7h1v3h-1zM5 7h1v3h-1z"></path></svg>
<svg width="40" height="50" viewBox="0 0 8 10" shape-rendering="crispEdges"><path fill="#c9ced6" d="M2 0h4v3h-4z"></path><path fill="#1a1a22" d="M3 1h2v1h-2z"></path><path fill="#e8b23a" d="M2 3h4v4h-4z"></path><path fill="#e7b48f" d="M1 4h1v2h-1zM6 4h1v2h-1z"></path><path fill="#e8e8f0" d="M7 0h1v6h-1z"></path><path fill="#6b4a2e" d="M2 7h1v3h-1zM5 7h1v3h-1z"></path></svg>
<svg width="40" height="50" viewBox="0 0 8 10" shape-rendering="crispEdges"><path fill="#4f9a4c" d="M2 0h4v3h-4zM1 2h1v2h-1z"></path><path fill="#e7b48f" d="M3 1h2v2h-2z"></path><path fill="#3d7a3a" d="M2 3h4v4h-4z"></path><path fill="#c08a4a" d="M0 2h1v6h-1z"></path><path fill="#5a4632" d="M2 7h1v3h-1zM5 7h1v3h-1z"></path></svg>
</div>
<svg class="autohit" style="position: absolute; right: 70px; bottom: 80px" width="40" height="40" viewBox="0 0 9 9" shape-rendering="crispEdges"><path fill="#ffffff" d="M8 0h1v1h-1zM7 1h1v1h-1zM6 2h1v1h-1zM5 3h1v1h-1zM4 4h1v1h-1zM3 5h1v1h-1zM2 6h1v1h-1zM1 7h1v1h-1z"></path></svg>
<div class="fight" style="position: absolute; left: 0; right: 0; top: 110px; text-align: center; font-family: 'Jersey 10', monospace; font-size: 64px; line-height: 1; color: #ffe066; text-shadow: 3px 3px 0 #000">FIGHT!</div>
</sc-if>
</div>

<div style="margin: 0 12px; height: 6px; background: #1a1612">
<div style="width: {{barPct}}%; height: 100%; background: {{barColor}}"></div>
</div>

<div style="padding: 12px 14px 0; font-size: 14px; line-height: 1.5">
<span style="color: #a89a84">Stage 45 starts over.</span> Levels and coins are kept. Burn tokens to get stronger.
</div>

<div style="padding: 12px 12px 0; font-size: 12px; color: #a89a84">Upgrade before the next try</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 6px 12px 0">
<button style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: #e8b23a; color: #1a1206; border: 0; box-shadow: inset 0 -3px 0 #8a5e14; font-family: 'Pixelify Sans', sans-serif; font-size: 15px; font-weight: 600"><span>Shieldbearer +1</span><span>1.4K</span></button>
<button style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: #2a231c; color: #efe6d4; border: 0; box-shadow: inset 0 -3px 0 #000; font-family: 'Pixelify Sans', sans-serif; font-size: 15px"><span>Wanderer +1</span><span style="color: #a89a84">9.8K</span></button>
</div>

<div style="margin-top: auto; display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-top: 2px solid #1f1a15; font-size: 12px; color: #a89a84">
<svg width="10" height="12" viewBox="0 0 6 7" shape-rendering="crispEdges"><path fill="#ff6a2b" d="M2 0h1v1h-1zM1 1h3v1h-3zM1 2h4v4h-4zM2 6h2v1h-2z"></path><path fill="#ffd36a" d="M2 4h2v2h-2z"></path></svg>
<span>The fight loops while your agent burns tokens</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":720}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { phase: 'down', t: 7 };
}
componentDidMount() {
this.timer = setInterval(() => {
const s = this.state;
if (s.phase === 'down') {
this.setState(s.t <= 1 ? { phase: 'fight', t: 6 } : { t: s.t - 1 });
} else {
this.setState(s.t <= 1 ? { phase: 'down', t: 10 } : { t: s.t - 1 });
}
}, 1000);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const s = this.state;
const down = s.phase === 'down';
return {
down: down,
fighting: !down,
count: s.t,
phaseLabel: down ? 'respawning' : 'boss · try again',
hpPct: down ? 14 : 100 - (6 - s.t) * 12,
barPct: down ? (10 - s.t) * 10 : 100,
barColor: down ? '#e8b23a' : '#7cc35b'
};
}
}
</script>
</body>
</html>
