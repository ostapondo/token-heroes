<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bosses</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Pixelify+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#e8b23a}a:hover{color:#ffd27a}
.bob{animation:bob 1s steps(2) infinite}
@keyframes bob{0%{transform:translateY(0)}100%{transform:translateY(-4px)}}
.p-rise{position:absolute;bottom:-8px;animation-name:rise;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(-12px,-210px);opacity:0}}
.p-fall{position:absolute;top:-14px;animation-name:fall;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes fall{0%{transform:translate(0,0);opacity:0}8%{opacity:1}100%{transform:translate(-10px,230px);opacity:.8}}
.p-slant{position:absolute;top:-14px;animation-name:slant;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes slant{0%{transform:translate(0,0);opacity:0}8%{opacity:1}100%{transform:translate(-90px,230px);opacity:.8}}
.flick{animation:flick 1.4s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.7}50%{opacity:1}}
.spin{animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 24px rgba(224,37,47,.25)}50%{box-shadow:inset 0 0 64px rgba(224,37,47,.65)}}
.bolt{animation:bolt 3.2s steps(1) infinite}
@keyframes bolt{0%,84%{opacity:0}85%{opacity:1}87%{opacity:0}89%{opacity:1}93%,100%{opacity:0}}
.drift{animation:drift 5s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-20px)}to{transform:translateX(20px)}}
.ghost{animation:ghost .5s steps(2) infinite;transform-origin:50% 100%}
@keyframes ghost{0%{transform:scaleY(1)}100%{transform:scaleY(1.3)}}
.bub{position:absolute;width:6px;height:6px;background:#ffd36a;animation:bub 1.6s steps(4) infinite}
@keyframes bub{0%{transform:scale(0);opacity:0}40%{transform:scale(1);opacity:1}70%{transform:scale(1.5) translateY(-4px);opacity:0}100%{opacity:0}}
.breath{transform-origin:100% 50%;animation:breath 3s steps(6) infinite}
@keyframes breath{0%,55%{opacity:0;transform:scaleX(0)}62%{opacity:1;transform:scaleX(1)}85%{opacity:1;transform:scaleX(1.06)}92%,100%{opacity:0;transform:scaleX(1)}}
.twinkle{position:absolute;width:4px;height:4px;background:#fff3c4;animation:twinkle 1.8s steps(3) infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.2)}}
</style>
</helmet>
<div style="width: 940px; height: 660px; box-sizing: border-box; padding: 24px; background: #0d0b09; color: #efe6d4; font-family: 'Pixelify Sans', sans-serif; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Jersey 10', monospace; font-weight: 400; font-size: 40px; line-height: 1">BOSSES</h1>
<span style="font-size: 14px; color: #a89a84">Every boss brings its own weather. The cycle repeats deeper and harder.</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{bosses}}" as="b" hint-placeholder-count="8">
<div style="background: #1a1612; border: 2px solid #3b3128; display: flex; flex-direction: column">
<div style="position: relative; height: 200px; overflow: hidden; background: {{b.sky}}">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: {{b.floor}}; border-top: 2px solid #000"></div>

<sc-if value="{{b.is.dragon}}" hint-placeholder-val="{{ false }}">
<div class="flick" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 100%, rgba(255,90,31,.6), rgba(255,90,31,0) 65%)"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: #e0451a; border-top: 2px solid #ffb02e"></div>
<div style="position: absolute; left: 6px; bottom: 22px; width: 34px; height: 8px; background: #3a1408"></div>
<div style="position: absolute; left: 70px; bottom: 8px; width: 46px; height: 10px; background: #3a1408"></div>
<div style="position: absolute; right: 12px; bottom: 18px; width: 28px; height: 8px; background: #3a1408"></div>
<span class="bub" style="left: 20%; bottom: 10px"></span>
<span class="bub" style="left: 52%; bottom: 24px; animation-delay: -.6s"></span>
<span class="bub" style="left: 80%; bottom: 6px; animation-delay: -1.1s"></span>
<span class="bub" style="left: 36%; bottom: 28px; animation-delay: -.3s"></span>
</sc-if>
<sc-if value="{{b.is.demon}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 50%; bottom: 2px; width: 150px; height: 150px; margin-left: -75px; transform: scaleY(.28); transform-origin: 50% 100%">
<svg class="spin" width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="68" fill="none" stroke="#e0252f" stroke-width="5" stroke-dasharray="14 8"></circle><circle cx="75" cy="75" r="52" fill="none" stroke="#ff7a3d" stroke-width="3" stroke-dasharray="4 10"></circle></svg>
</div>
<div class="pulse" style="position: absolute; inset: 0"></div>
</sc-if>
<sc-if value="{{b.is.zombie}}" hint-placeholder-val="{{ false }}">
<svg style="position: absolute; left: 8px; bottom: 36px" width="24" height="30" viewBox="0 0 4 5" shape-rendering="crispEdges"><path fill="#4a5048" d="M1 0h2v1h-2zM0 1h4v4h-4z"></path><path fill="#2a2e28" d="M1 2h2v1h-2z"></path></svg>
<svg style="position: absolute; right: 10px; bottom: 36px" width="18" height="24" viewBox="0 0 3 4" shape-rendering="crispEdges"><path fill="#4a5048" d="M0 0h3v4h-3z"></path><path fill="#2a2e28" d="M1 1h1v2h-1zM0 1h3v1h-3z"></path></svg>
<div class="drift" style="position: absolute; left: -40px; right: -40px; bottom: 0; height: 56px; background: rgba(160,180,150,.16)"></div>
</sc-if>
<sc-if value="{{b.is.skeleton}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; right: 18px; top: 16px; width: 26px; height: 26px; background: #d6e4dc; box-shadow: 0 0 20px rgba(214,228,220,.5)"></div>
<div style="position: absolute; left: 50%; bottom: 0; width: 170px; margin-left: -85px; height: 40px; background: radial-gradient(ellipse at 50% 100%, rgba(82,224,196,.4), rgba(82,224,196,0) 70%)"></div>
<svg class="ghost" style="position: absolute; left: 22px; bottom: 40px" width="20" height="30" viewBox="0 0 4 6" shape-rendering="crispEdges"><path fill="#52e0c4" d="M1 0h1v1h-1zM1 1h2v2h-2zM0 3h4v3h-4z"></path><path fill="#d6fff5" d="M1 4h2v2h-2z"></path></svg>
<svg class="ghost" style="position: absolute; right: 22px; bottom: 40px; animation-delay: -.25s" width="20" height="30" viewBox="0 0 4 6" shape-rendering="crispEdges"><path fill="#52e0c4" d="M2 0h1v1h-1zM1 1h2v2h-2zM0 3h4v3h-4z"></path><path fill="#d6fff5" d="M1 4h2v2h-2z"></path></svg>
</sc-if>
<sc-if value="{{b.is.golem}}" hint-placeholder-val="{{ false }}">
<svg style="position: absolute; left: 0; top: 0" width="70" height="56" viewBox="0 0 14 11" shape-rendering="crispEdges"><path fill="#bfeaff" d="M0 0h14v1h-14zM0 1h1v8h-1zM2 1h1v4h-1zM5 1h1v6h-1zM8 1h1v3h-1zM11 1h1v2h-1z"></path><path fill="#ffffff" d="M2 4h1v1h-1zM5 6h1v1h-1z"></path></svg>
<svg style="position: absolute; right: 0; top: 0" width="70" height="56" viewBox="0 0 14 11" shape-rendering="crispEdges"><path fill="#bfeaff" d="M0 0h14v1h-14zM13 1h1v8h-1zM11 1h1v4h-1zM8 1h1v6h-1zM5 1h1v3h-1zM2 1h1v2h-1z"></path><path fill="#ffffff" d="M11 4h1v1h-1zM8 6h1v1h-1z"></path></svg>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: #dff3ff; border-top: 2px solid #ffffff"></div>
<div class="drift" style="position: absolute; left: -40px; right: -40px; bottom: 30px; height: 30px; background: rgba(223,243,255,.16)"></div>
</sc-if>
<sc-if value="{{b.is.spider}}" hint-placeholder-val="{{ false }}">
<svg style="position: absolute; left: 0; top: 0" width="70" height="70" viewBox="0 0 70 70" shape-rendering="crispEdges"><path d="M0 0L70 70M0 0L35 70M0 0L70 35M0 22L22 0M0 44L44 0M0 66L66 0" stroke="rgba(220,230,210,.4)" stroke-width="1" fill="none"></path></svg>
<svg style="position: absolute; right: 0; top: 0; transform: scaleX(-1)" width="70" height="70" viewBox="0 0 70 70" shape-rendering="crispEdges"><path d="M0 0L70 70M0 0L35 70M0 0L70 35M0 22L22 0M0 44L44 0" stroke="rgba(220,230,210,.4)" stroke-width="1" fill="none"></path></svg>
<div class="drift" style="position: absolute; left: -40px; right: -40px; bottom: 0; height: 50px; background: rgba(166,216,61,.14)"></div>
</sc-if>
<sc-if value="{{b.is.wraith}}" hint-placeholder-val="{{ false }}">
<div class="bolt" style="position: absolute; inset: 0; background: rgba(230,240,255,.3)"></div>
<svg class="bolt" style="position: absolute; left: 24px; top: 0" width="48" height="140" viewBox="0 0 12 35" shape-rendering="crispEdges"><path fill="#fff7b0" d="M6 0h2v6h-2zM4 6h3v6h-3zM6 12h3v6h-3zM3 18h4v6h-4zM5 24h2v6h-2zM4 30h2v5h-2z"></path></svg>
</sc-if>
<sc-if value="{{b.is.slime}}" hint-placeholder-val="{{ false }}">
<div class="flick" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 80%, rgba(255,211,106,.35), rgba(255,211,106,0) 60%)"></div>
<span class="twinkle" style="left: 14%; top: 30%"></span>
<span class="twinkle" style="left: 78%; top: 22%; animation-delay: -.6s"></span>
<span class="twinkle" style="left: 64%; top: 58%; animation-delay: -1.2s"></span>
<span class="twinkle" style="left: 26%; top: 64%; animation-delay: -.9s"></span>
</sc-if>

<sc-for list="{{b.parts}}" as="p" hint-placeholder-count="14">
<span class="{{p.cls}}" style="{{p.style}}"></span>
</sc-for>

<div style="position: absolute; left: 50%; bottom: 14px; margin-left: {{b.offset}}">
<div class="bob" style="position: relative; filter: drop-shadow(0 0 5px {{b.edge}})">
<sc-if value="{{b.is.dragon}}" hint-placeholder-val="{{ false }}">
<svg class="breath" style="position: absolute; left: -84px; top: 30px" width="88" height="40" viewBox="0 0 11 5" shape-rendering="crispEdges"><path fill="#ff5a1f" d="M0 1h3v3h-3zM3 0h4v5h-4zM7 1h4v3h-4z"></path><path fill="#ffb02e" d="M1 2h2v1h-2zM3 1h5v3h-5zM8 2h3v1h-3z"></path><path fill="#fff1a8" d="M5 2h6v1h-6z"></path></svg>
<svg width="150" height="120" viewBox="0 0 20 16" shape-rendering="crispEdges"><path fill="#7a1d0c" d="M13 1h2v1h-2zM12 2h4v1h-4zM11 3h5v1h-5zM10 4h6v1h-6zM9 5h7v1h-7zM9 6h6v1h-6z"></path><path fill="#c2361a" d="M1 3h4v4h-4zM0 5h1v2h-1zM5 5h2v4h-2zM7 7h8v5h-8zM15 10h2v2h-2zM17 11h2v1h-2z"></path><path fill="#ffb02e" d="M8 11h6v1h-6zM5 8h2v1h-2z"></path><path fill="#e8d9c0" d="M4 1h1v2h-1zM2 2h1v1h-1z"></path><path fill="#ffd36a" d="M2 4h1v1h-1z"></path><path fill="#2a0a04" d="M0 6h3v1h-3z"></path><path fill="#7a1d0c" d="M8 12h2v3h-2zM13 12h2v3h-2zM7 15h3v1h-3zM12 15h3v1h-3zM19 12h1v1h-1z"></path></svg>
</sc-if>
<sc-if value="{{b.is.demon}}" hint-placeholder-val="{{ false }}">
<svg width="112" height="112" viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#2a0408" d="M0 5h3v6h-3zM13 5h3v6h-3z"></path><path fill="#5a0a12" d="M1 6h1v4h-1zM14 6h1v4h-1z"></path><path fill="#e8d9c0" d="M1 1h2v2h-2zM2 3h2v2h-2zM13 1h2v2h-2zM12 3h2v2h-2z"></path><path fill="#8e0f1a" d="M3 5h10v8h-10z"></path><path fill="#4a060c" d="M3 11h10v2h-10zM4 13h3v3h-3zM9 13h3v3h-3zM4 6h3v1h-3zM9 6h3v1h-3z"></path><path fill="#ffd23f" d="M5 7h2v1h-2zM9 7h2v1h-2z"></path><path fill="#120406" d="M5 9h6v3h-6z"></path><path fill="#e8d9c0" d="M5 9h1v2h-1zM10 9h1v2h-1z"></path></svg>

<sc-if value="{{b.is.zombie}}" hint-placeholder-val="{{ false }}">
<svg width="112" height="112" viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#7fa65a" d="M5 1h5v5h-5zM1 7h4v1h-4zM1 9h4v1h-4z"></path><path fill="#5d8040" d="M0 7h1v1h-1zM0 9h1v1h-1z"></path><path fill="#3b2a1a" d="M5 1h5v1h-5zM5 2h1v1h-1z"></path><path fill="#e8e86a" d="M6 3h1v1h-1zM8 3h1v1h-1z"></path><path fill="#2a1a10" d="M6 5h3v1h-3z"></path><path fill="#5a6b7a" d="M5 6h5v5h-5z"></path><path fill="#7fa65a" d="M6 8h1v1h-1zM8 9h1v1h-1z"></path><path fill="#3d3a2e" d="M5 11h5v2h-5zM5 13h2v2h-2zM8 13h2v2h-2z"></path><path fill="#2a1a10" d="M4 15h3v1h-3zM8 15h3v1h-3z"></path></svg>
</sc-if>
<sc-if value="{{b.is.skeleton}}" hint-placeholder-val="{{ false }}">
<svg width="112" height="112" viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#e9e2cc" d="M5 1h6v5h-6zM7 6h2v6h-2zM5 7h6v1h-6zM5 9h6v1h-6zM6 11h4v1h-4zM4 7h1v4h-1zM11 7h1v4h-1zM6 12h1v3h-1zM9 12h1v3h-1zM5 15h2v1h-2zM9 15h2v1h-2z"></path><path fill="#0c1614" d="M6 3h2v1h-2zM9 3h2v1h-2zM7 5h1v1h-1zM9 5h1v1h-1z"></path><path fill="#52e0c4" d="M6 3h1v1h-1zM10 3h1v1h-1z"></path><path fill="#a9b3bf" d="M3 2h1v8h-1z"></path><path fill="#6b4a2e" d="M2 9h3v1h-3zM12 7h3v5h-3z"></path><path fill="#c9a13a" d="M13 9h1v1h-1z"></path></svg>
</sc-if>
<sc-if value="{{b.is.golem}}" hint-placeholder-val="{{ false }}">
<svg width="112" height="112" viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#6e7a86" d="M5 1h6v3h-6zM2 4h12v8h-12zM0 5h2v7h-2zM14 5h2v7h-2zM3 12h4v4h-4zM9 12h4v4h-4z"></path><path fill="#4a535c" d="M2 10h12v2h-12zM0 10h2v2h-2zM14 10h2v2h-2z"></path><path fill="#bfeaff" d="M1 3h2v2h-2zM13 3h2v2h-2zM2 2h1v1h-1zM13 2h1v1h-1zM7 0h2v1h-2z"></path><path fill="#8fd8ff" d="M6 2h1v1h-1zM9 2h1v1h-1zM7 6h2v1h-2zM6 7h1v2h-1zM9 8h1v2h-1z"></path></svg>
</sc-if>
<sc-if value="{{b.is.spider}}" hint-placeholder-val="{{ false }}">

</div>
</div>
<span style="position: absolute; left: 8px; top: 8px; font-family: 'Jersey 10', monospace; font-size: 18px; line-height: 1; padding: 2px 6px; background: #000; color: {{b.edge}}">{{b.tag}}</span>
</div>
<div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'Jersey 10', monospace; font-size: 24px; line-height: 1">{{b.name}}</div>
<div style="font-size: 12px; color: #a89a84">{{b.look}}</div>
<div style="font-size: 13px">{{b.effectLabel}} <span style="color: {{b.edge}}">{{b.status}}</span></div>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":940,"height":660}}'>
class Component extends DCLogic {
renderVals() {
const list = [
{ key: 'dragon', tag: 'FIRE', name: 'Cinder Dragon', sky: '#240b05', floor: '#3a1408', edge: '#ff6a2b', look: 'Lava floor, embers, fire breath', status: 'BURNING', parts: 'embers', offset: '-60px' },
{ key: 'demon', tag: 'HELL', name: 'Archfiend', sky: '#140305', floor: '#2a070a', edge: '#e0252f', look: 'Summoning ring, red pulse, ash', status: 'CURSED', parts: 'ash', offset: '-56px' },
{ key: 'zombie', tag: 'GRAVE', name: 'Grave Brute', sky: '#0f1412', floor: '#1e241c', edge: '#a3c47a', look: 'Graveyard, drizzle, fog', status: 'ROTTING', parts: 'drizzle', offset: '-56px' },
{ key: 'skeleton', tag: 'BONE', name: 'Bone Knight', sky: '#071110', floor: '#11201d', edge: '#52e0c4', look: 'Moonlight, ghost flames, wisps', status: 'HAUNTED', parts: 'wisps', offset: '-56px' },
{ key: 'golem', tag: 'ICE', name: 'Frost Golem', sky: '#0a1b28', floor: '#14344a', edge: '#8fd8ff', look: 'Blizzard, frozen ground', status: 'FROZEN', parts: 'snow', offset: '-56px' },
{ key: 'spider', tag: 'VENOM', name: 'Broodmother', sky: '#0b1006', floor: '#18200d', edge: '#a6d83d', look: 'Webs, acid drips', status: 'POISONED', parts: 'drips', offset: '-56px' },
{ key: 'wraith', tag: 'STORM', name: 'Storm Wraith', sky: '#0b111d', floor: '#182436', edge: '#ffe94a', look: 'Heavy rain, lightning', status: 'SHOCKED', parts: 'rain', offset: '-56px' },
{ key: 'slime', tag: 'GOLD', name: 'Slime King', sky: '#1a1406', floor: '#2c220c', edge: '#ffd36a', look: 'Coin shower, sparkles', status: 'SLOWED', parts: 'coins', offset: '-56px' }
];
const particle = (kind, i) => {
const x = (i * 41 + 7) % 100;
const spread = ((i * 53) % 17) / 10;
const delay = -((i * 29) % 30) / 10;
const kinds = {
embers: { cls: 'p-rise', dur: 2.4 + spread, look: 'width: ' + (i % 3 === 0 ? 5 : 3) + 'px; height: ' + (i % 3 === 0 ? 5 : 3) + 'px; background: ' + (i % 2 ? '#ffb02e' : '#ff5a1f') },
ash: { cls: 'p-rise', dur: 2.6 + spread, look: 'width: 3px; height: 3px; background: ' + (i % 2 ? '#ff4a3d' : '#ff9a3d') },
drizzle: { cls: 'p-fall', dur: 0.9 + spread / 3, look: 'width: 1px; height: 8px; background: #8fa59a' },
wisps: { cls: 'p-rise', dur: 3 + spread, look: 'width: 3px; height: 3px; background: #52e0c4' },
snow: { cls: 'p-slant', dur: 2 + spread, look: 'width: ' + (i % 4 === 0 ? 4 : 2) + 'px; height: ' + (i % 4 === 0 ? 4 : 2) + 'px; background: #ffffff' },
drips: { cls: 'p-fall', dur: 2.2 + spread, look: 'width: 2px; height: 6px; background: #a6d83d' },
rain: { cls: 'p-slant', dur: 0.45 + spread / 6, look: 'width: 1px; height: 16px; background: #b9cff0' },
coins: { cls: 'p-fall', dur: 2.4 + spread, look: 'width: 4px; height: 4px; background: #ffd36a; box-shadow: 1px 1px 0 #a8661a' }
};
const k = kinds[kind];
return { cls: k.cls, style: 'left: ' + x + '%; ' + k.look + '; animation-duration: ' + k.dur.toFixed(2) + 's; animation-delay: ' + delay + 's' };
};
const bosses = list.map((b) => {
const count = b.parts === 'rain' || b.parts === 'drizzle' ? 26 : 14;
const parts = [];
for (let i = 0; i < count; i++) parts.push(particle(b.parts, i));
const is = {};
is[b.key] = true;
return Object.assign({}, b, { is: is, parts: parts, effectLabel: 'Inflicts' });
});
return { bosses: bosses };
}
}
